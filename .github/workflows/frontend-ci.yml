# ================================================================
# NOVA — Frontend CI
# Triggered on any push / PR that touches the Next.js frontend
# or this workflow file.
#
# Pipeline:
#   lint       → ESLint via `next lint`
#   typecheck  → TypeScript via `tsc --noEmit`
#   build      → `next build` — the real gate (broken = fails CI)
#
# NEXT_PUBLIC_* env vars in build are safe placeholders.
# Real values live in Railway / Vercel — never in workflow files.
# ================================================================
name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "nova-ai-assistant/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "nova-ai-assistant/frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: nova-ai-assistant/frontend

jobs:
  # ── Lint ────────────────────────────────────────────────
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nova-ai-assistant/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      # Uses the project's eslint.config.mjs automatically
      - name: Run ESLint
        run: npx next lint

  # ── Type Check ──────────────────────────────────────────
  typecheck:
    name: Type Check (TypeScript)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nova-ai-assistant/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: TypeScript check
        run: npx tsc --noEmit

  # ── Build ───────────────────────────────────────────────
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    # Safe CI placeholder values — embedded at build time only.
    # Never use real keys here. Production values are set in
    # Railway / Vercel environment variables.
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci_placeholder_anon_key"
      NEXT_PUBLIC_API_URL: "https://placeholder.up.railway.app"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nova-ai-assistant/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build Next.js app
        run: npm run build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: |
            nova-ai-assistant/frontend/.next/
            !nova-ai-assistant/frontend/.next/cache/
          retention-days: 3
