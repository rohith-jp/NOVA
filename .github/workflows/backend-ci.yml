# ================================================================
# NOVA — Backend CI
# Triggered on any push / PR that touches the Python backend,
# Celery worker, or this workflow file.
#
# Pipeline:
#   lint        → ruff (errors + format)
#   test        → pytest unit tests (no live APIs)
#   docker      → validate Dockerfile builds cleanly (no push)
#
# No secrets used. All env vars are safe CI-only placeholders.
# ================================================================
name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "nova-ai-assistant/backend/**"
      - "nova-ai-assistant/worker/**"
      - "nova-ai-assistant/db/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "nova-ai-assistant/backend/**"
      - "nova-ai-assistant/worker/**"
      - "nova-ai-assistant/db/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: nova-ai-assistant/backend

jobs:
  # ── Lint ────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nova-ai-assistant/backend/requirements.txt

      - name: Install ruff
        run: pip install ruff==0.9.10

      - name: ruff check (errors & warnings)
        run: ruff check app/ --output-format=github

      - name: ruff format check
        run: ruff format app/ --check

  # ── Unit Tests ──────────────────────────────────────────
  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    env:
      # Safe CI-only placeholders — NOT real secrets.
      # Real values live in Railway only, never here.
      ENCRYPTION_SECRET_KEY: "ci-placeholder-key-exactly-32bytes!"
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_ANON_KEY: "ci_placeholder_anon_key"
      SUPABASE_SERVICE_ROLE_KEY: "ci_placeholder_service_role_key"
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      REDIS_URL: "redis://localhost:6379"
      GEMINI_API_KEY: "ci_placeholder_gemini"
      ANTHROPIC_API_KEY: "ci_placeholder_anthropic"
      OPENAI_API_KEY: "ci_placeholder_openai"
      TAVILY_API_KEY: "ci_placeholder_tavily"
      ELEVENLABS_API_KEY: "ci_placeholder_elevenlabs"
      ELEVENLABS_VOICE_ID: "21m00Tcm4TlvDq8ikWAM"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nova-ai-assistant/backend/requirements.txt

      # Lean install — skip torch/sentence-transformers (1 GB+).
      # Unit tests mock those via conftest.py.
      - name: Install CI dependencies
        run: |
          pip install --upgrade pip --quiet
          pip install --quiet \
            fastapi==0.141.1 \
            uvicorn==0.52.4 \
            python-dotenv==1.0.1 \
            cryptography==50.0.0 \
            "python-jose[cryptography]==3.5.0" \
            PyJWT==2.13.0 \
            argon2-cffi==25.1.0 \
            httpx==0.28.1 \
            "pydantic==2.13.4" \
            celery==5.6.3 \
            redis==8.1.0 \
            pytest==8.3.5 \
            pytest-asyncio==0.24.0

      # conftest.py auto-skips all integration tests (test_gemini,
      # test_planner, test_memory, test_auth, etc.)
      - name: Run unit tests
        run: pytest app/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: nova-ai-assistant/backend/.pytest_cache/
          retention-days: 7

  # ── Docker Build Validation ──────────────────────────────
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Validates the Dockerfile is correct — does NOT push.
      - name: Build backend image (dry run)
        uses: docker/build-push-action@v6
        with:
          context: nova-ai-assistant/backend
          file: nova-ai-assistant/backend/Dockerfile
          push: false
          tags: nova-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
