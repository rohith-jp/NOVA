# ruff configuration for NOVA backend
# Docs: https://docs.astral.sh/ruff/configuration/

target-version = "py312"
line-length = 100

[lint]
# Rules enabled: pyflakes (F), pycodestyle (E/W), isort (I),
# bugbear (B), comprehensions (C4), simplify (SIM)
select = ["E", "F", "W", "I", "B", "C4", "SIM"]

ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default args (FastAPI Depends pattern)
    "B904",   # raise-without-from — existing code, fix incrementally
    "SIM102", # nested if — sometimes more readable
    "SIM108", # ternary operator — sometimes less readable
    "E711",   # comparison to None
    "E712",   # comparison to True/False
    "W293",   # blank line contains whitespace — formatter handles this
    "I001",   # import sorting — applied only to new files for now
]

# Paths to exclude from linting
exclude = [
    "__pycache__",
    ".venv",
    "venv",
    "*.pyc",
    # Test files use legacy plain-assert style — lint only app source
    "app/**/test_*.py",
    "app/test_*.py",
]

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
indent-style = "space"
