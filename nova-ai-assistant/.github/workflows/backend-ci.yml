# ============================================================
# NOVA — Backend CI
#
# Runs on every push / PR that touches backend or worker code.
#
# Jobs (run in order, each depends on the previous):
#   lint          → ruff check + format check
#   test          → pytest (unit tests only, no live APIs)
#   docker-build  → validate the backend Dockerfile builds cleanly
#
# Secrets used: none (all env vars are safe placeholders for CI)
# ============================================================
name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "nova-ai-assistant/backend/**"
      - "nova-ai-assistant/worker/**"
      - "nova-ai-assistant/db/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "nova-ai-assistant/backend/**"
      - "nova-ai-assistant/worker/**"
      - "nova-ai-assistant/db/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: nova-ai-assistant/backend

jobs:
  # ── 1. Lint ──────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nova-ai-assistant/backend/requirements.txt

      - name: Install ruff
        run: pip install ruff==0.9.10

      # Reports inline annotations in the PR diff
      - name: ruff — check for errors
        run: ruff check app/ --output-format=github

      - name: ruff — check formatting
        run: ruff format app/ --check

  # ── 2. Unit Tests ─────────────────────────────────────────
  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    env:
      # ── Safe CI-only placeholder values ──────────────────
      # These are NOT real secrets. Real secrets live in Railway.
      # They exist only so modules can import without crashing.
      ENCRYPTION_SECRET_KEY: "ci-placeholder-key-exactly-32bytes!"
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_ANON_KEY: "ci_placeholder_anon_key"
      SUPABASE_SERVICE_ROLE_KEY: "ci_placeholder_service_role_key"
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      REDIS_URL: "redis://localhost:6379"
      GEMINI_API_KEY: "ci_placeholder_gemini"
      ANTHROPIC_API_KEY: "ci_placeholder_anthropic"
      OPENAI_API_KEY: "ci_placeholder_openai"
      TAVILY_API_KEY: "ci_placeholder_tavily"
      ELEVENLABS_API_KEY: "ci_placeholder_elevenlabs"
      ELEVENLABS_VOICE_ID: "21m00Tcm4TlvDq8ikWAM"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nova-ai-assistant/backend/requirements.txt

      # Install a lean subset of deps — omit torch/sentence-transformers
      # (1 GB+) because unit tests mock those imports via conftest.py.
      - name: Install CI dependencies
        run: |
          pip install --upgrade pip --quiet
          pip install --quiet \
            fastapi==0.141.1 \
            uvicorn==0.52.4 \
            python-dotenv==1.0.1 \
            cryptography==50.0.0 \
            "python-jose[cryptography]==3.5.0" \
            PyJWT==2.13.0 \
            argon2-cffi==25.1.0 \
            httpx==0.28.1 \
            "pydantic==2.13.4" \
            celery==5.6.3 \
            redis==8.1.0 \
            pytest==8.3.5 \
            pytest-asyncio==0.24.0

      # conftest.py auto-skips all integration tests (test_gemini, test_planner,
      # test_memory, test_auth, etc.) — only pure unit tests run here.
      - name: Run unit tests
        run: pytest app/ -v --tb=short

      - name: Upload test results (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: nova-ai-assistant/backend/.pytest_cache/
          retention-days: 7

  # ── 3. Docker Build Check ────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint   # run in parallel with test, gated only on lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Validates the Dockerfile is syntactically correct and all
      # COPY / RUN instructions resolve — does NOT push.
      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: nova-ai-assistant/backend
          file: nova-ai-assistant/backend/Dockerfile
          push: false
          tags: nova-backend:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
